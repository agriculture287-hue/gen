    <!-- Error Protection for External Scripts -->
    <script>
      // Top-level protection to suppress unhandled third-party cross-origin script errors
      window.onerror = function (msg, url, lineNo, colNo, err) {
        if (!msg || msg === 'Script error.' || (typeof msg === 'string' && msg.indexOf('Script error') !== -1)) {
          return true;
        }
        if (url && typeof url === 'string' && url.indexOf(window.location.host) === -1 && url.indexOf('localhost') === -1) {
          return true;
        }
        return false;
      };

      window.addEventListener('error', function (event) {
        if (!event || event.message === 'Script error.' || (event.filename && !event.filename.includes(window.location.host))) {
          if (event && event.preventDefault) event.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        if (event && event.reason) {
          var reasonStr = '' + (event.reason.message || event.reason);
          if (reasonStr.indexOf('Script error') !== -1) {
            if (event.preventDefault) event.preventDefault();
          }
        }
      });
    </script>

    <!-- Cleanup any legacy ad service workers -->
