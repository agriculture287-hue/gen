name: Deploy to Production & Vercel Verification

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: Build Verification & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Typecheck TypeScript
        run: npm run lint

      - name: Build Application
        run: npm run build

  deploy-vercel:
    name: Auto Deploy to Vercel Production
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Vercel Credentials & Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning ::VERCEL_TOKEN secret is not set in GitHub repository secrets. Deferring to Vercel GitHub Native Integration."
            echo "To enable direct GitHub Actions deployment to Vercel, add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 0
          fi

          echo "Installing Vercel CLI..."
          npm install -g vercel@latest

          echo "Pulling Vercel Environment Information..."
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN

          echo "Building Project Artifacts for Vercel..."
          vercel build --prod --token=$VERCEL_TOKEN

          echo "Deploying Project Artifacts to Vercel Production..."
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

