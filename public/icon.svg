<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141422" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8A2BE2" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Dark Rounded Square -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="url(#neonGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Glowing Sonic Disc -->
  <circle cx="256" cy="256" r="140" fill="#0d0d16" stroke="url(#neonGrad)" stroke-width="6" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="95" fill="none" stroke="#252538" stroke-width="2" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="60" fill="#181829" stroke="#00F0FF" stroke-width="3" />

  <!-- Dynamic Music / Soundwave Waves & Note -->
  <path d="M220 180 V310 A 30 30 0 1 1 190 280 A 30 30 0 0 1 220 305 V 210 L 310 190 V 290 A 30 30 0 1 1 280 260 A 30 30 0 0 1 310 285 V 160 Z" fill="url(#neonGrad)" filter="url(#neonGlow)" />

  <!-- Equalizer Neon Bars -->
  <rect x="350" y="240" width="8" height="40" rx="4" fill="#00F0FF" />
  <rect x="366" y="210" width="8" height="70" rx="4" fill="#8A2BE2" />
  <rect x="382" y="230" width="8" height="50" rx="4" fill="#FF007F" />
</svg>
